name: Part 2 API Build and Test

on:
  push:
    branches: [ part2-api-final ]
  pull_request:
    branches: [ part2-api-final ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay/RaceDay.sln

    - name: Build solution
      run: dotnet build RaceDay/RaceDay.sln --no-restore

    - name: Run tests
      run: dotnet test RaceDay/RaceDay.sln --no-build --verbosity normal